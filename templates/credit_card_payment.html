{% extends "layout.html" %}
{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg p-5" style="width: 100%; max-width: 500px; border-radius: 20px;">

    <h3 class="text-center text-primary fw-bold mb-4">
      <i class="bi bi-credit-card-2-front-fill me-2"></i>Credit Card Payment
    </h3>

    <form method="post">
      <div class="mb-4">
        <label class="form-label fw-semibold">Cardholder Name</label>
        <input type="text" name="card_name" class="form-control rounded-pill" placeholder="e.g. John Doe" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Card Number</label>
        <input type="text" name="card_number" class="form-control rounded-pill" maxlength="16" placeholder="1234 5678 9012 3456" required>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Expiry Date</label>
          <input type="month" name="expiry" class="form-control rounded-pill" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">CVV</label>
          <input type="password" name="cvv" class="form-control rounded-pill" maxlength="4" placeholder="123" required>
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg rounded-pill">
          <i class="bi bi-lock-fill me-2"></i> Process Payment Securely
        </button>
      </div>
    </form>

  </div>
</div>

<!-- Add Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

{% endblock %}
