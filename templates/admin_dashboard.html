{% extends "layout.html" %}
{% block content %}
<h3>Admin Dashboard</h3>
<a href="/admin/add_event" class="btn btn-primary mb-3">➕ Add New Event</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>User</th>
      <th>Event</th>
      <th>Total Paid</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for row in summary %}
    <tr>
      <td>{{ row.UserName }}</td>
      <td>{{ row.Title }}</td>
      <td>${{ row.TotalPaid }}</td>
      <td>
        
        <td>
          <a href="{{ url_for('delete_event_direct', event_id=row.EventID) }}" 
             class="btn btn-danger btn-sm" 
             onclick="return confirm('Are you sure you want to delete this event?');">
            Delete
          </a>
        
          <a href="{{ url_for('edit_event', event_id=row.EventID) }}" 
             class="btn btn-warning btn-sm ms-2">
            Edit Price
          </a>
        </td>
        

      </td>
     
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
