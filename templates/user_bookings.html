{% extends "layout.html" %}
{% block content %}
<h3>My Bookings</h3>
<table class="table table-bordered">
  <thead>
    <tr>
      <th>Event</th>
      <th>Location</th>
      <th>Date</th>
      <th>Guests</th>
      <th>Amount</th>
      <th>Method</th>
      <th>Paid On</th>
    </tr>
  </thead>
  <tbody>
    {% for b in bookings %}
    <tr>
      <td>{{ b.Title }}</td>
      <td>{{ b.Location }}</td>
      <td>{{ b.Date }}</td>
      <td>{{ b.Guests }}</td>
      <td>${{ b.Amount }}</td>
      <td>{{ b.Method }}</td>
      <td>{{ b.PaymentDate }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
